<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>contacto</title>
  </head>
  <body hidden>
    <!--
      Esqueleto estático para que el parser de Netlify registre el formulario
      en el deploy. No está enlazado y lleva noindex: la página visible es
      /contacto/. Los name tienen que coincidir exactamente con ese formulario
      (form-name, honeypot bot-field, nombre, email, tipo, mensaje).
    -->
    <form
      name="contacto"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contacto" />
      <p hidden>
        <label>No llenar si eres humano: <input name="bot-field" /></label>
      </p>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <select name="tipo">
        <option value="desarrollo-carta">Desarrollo de carta</option>
        <option value="apertura">Apertura y concepto</option>
        <option value="mentoria">Mentoría</option>
        <option value="diagnostico">Diagnóstico</option>
        <option value="otro">Otro</option>
      </select>
      <textarea name="mensaje"></textarea>
    </form>
  </body>
</html>
