[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fuerza el escaneo de formularios en el HTML publicado. Sin esto, un sitio
# con la detección apagada en el panel publica 0 forms aunque /contacto/ tenga
# el <form>. El esqueleto estático está en public/__forms.html.
[build.processing]
  ignore_html_forms = false

[[redirects]]
  from = "https://andresvalerio.com/*"
  to = "https://www.andresvalerio.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
